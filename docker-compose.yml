# Environnement local complet : application + MariaDB + MongoDB (docker compose up -d)
services:
  app:
    build: .
    ports: ["8000:8080"]
    env_file: .env
    environment:
      DB_HOST: db
      MONGODB_URI: mongodb://mongo:27017
      APP_URL: http://localhost:8000
    depends_on: [db, mongo]
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: vite_gourmand
    ports: ["3306:3306"]
    volumes:
      - ./database/00_database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - dbdata:/var/lib/mysql
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes:
  dbdata:
  mongodata:
